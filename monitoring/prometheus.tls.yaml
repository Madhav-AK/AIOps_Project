global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: backend
    scheme: https
    tls_config:
      ca_file: /certs/cert.pem
      server_name: backend
    static_configs:
      - targets: ['backend:8000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
