seed: 42
data:
  path: data/raw/paysim.csv
  prepared: data/prepared
  batch_rows: 250000
  workers: 2
  sample_size: 500000
  validation_fraction: 0.15
  test_fraction: 0.15
  minimum_fraud_per_split: 10
model:
  n_estimators: 100
  max_depth: 3
  learning_rate: 0.1
  n_jobs: 2
decision_threshold: 0.5
tracking:
  uri: http://127.0.0.1:5000
  experiment: transaction-fraud
  model_name: transaction-fraud
outputs:
  candidates: artifacts/candidates
  artifacts: artifacts/model
  reports: reports/model
operations:
  api_url: http://127.0.0.1:8000
  ca_bundle: null
  compose_files:
  - compose.yaml
maintenance:
  include_labelled_batch: true
  labelled_batch: data/incoming/labelled_batch.parquet
monitoring:
  window_size: 200
  minimum_window: 100
  drift_threshold: 0.2
  grafana_url: http://127.0.0.1:3000/d/fraud-operations
  prometheus_url: http://127.0.0.1:9090/alerts
  health_urls:
    mlflow: http://mlflow:5000/health
    model_server: http://model-server:8080/ping
    prometheus: http://prometheus:9090/-/ready
    grafana: http://grafana:3000/api/health
